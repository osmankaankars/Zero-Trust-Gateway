name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and checks
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -W error::DeprecationWarning -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check build==1.6.0
      - name: Build distributions
        run: python -m build
      - name: Install and smoke-test wheel
        run: |
          python -m venv /tmp/zero-trust-wheel-smoke
          /tmp/zero-trust-wheel-smoke/bin/python -m pip install --disable-pip-version-check dist/*.whl
          /tmp/zero-trust-wheel-smoke/bin/python -c "import zero_trust_gateway; assert zero_trust_gateway.__version__ == '0.2.0'"
          /tmp/zero-trust-wheel-smoke/bin/zero-trust-idp --generate-keyset --kid ci-smoke >/dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zero-trust-gateway-v0.2.0-dist
          path: dist/*
          if-no-files-found: error
